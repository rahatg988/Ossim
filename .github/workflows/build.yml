name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create android folder
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --org com.example --project-name ossim .
          cp /tmp/main.dart lib/main.dart

      - name: Android settings for Firebase
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle* || true
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml || true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ossim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
